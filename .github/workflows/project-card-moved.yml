name: Label Project Items

on:
  projects_v2_item:
    types: [created, edited, moved]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label item by project status
    runs-on: ubuntu-latest
    if: github.event.projects_v2_item.content_type == 'Issue' || github.event.projects_v2_item.content_type == 'PullRequest'
    steps:
      - name: Apply label based on project status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITEM_NODE_ID: ${{ github.event.projects_v2_item.node_id }}
          ITEM_STATUS: ${{ github.event.projects_v2_item.status }}
          CONTENT_TYPE: ${{ github.event.projects_v2_item.content_type }}
          CONTENT_NODE_ID: ${{ github.event.projects_v2_item.content_node_id }}
        run: |
          case "$ITEM_STATUS" in
            "Done"|"Closed") label="done" ;;
            "In Progress") label="in-progress" ;;
            "In Review") label="in-review" ;;
            "Blocked") label="blocked" ;;
            *) label="backlog" ;;
          esac

          # Resolve the issue/PR number from the content node id via GraphQL.
          number=$(gh api graphql -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on Issue { number }
                ... on PullRequest { number }
              }
            }' -F id="$CONTENT_NODE_ID" --jq '.data.node.number' 2>/dev/null || echo "")

          if [ -z "$number" ]; then
            echo "Could not resolve item number for $CONTENT_TYPE; skipping label."
            exit 0
          fi

          echo "Applying label '$label' to $CONTENT_TYPE #$number"
          gh api --method POST "repos/${{ github.repository }}/issues/$number/labels" \
            -f name="$label" \
            -H "X-GitHub-Api-Version: 2022-11-28" || echo "Label may already exist; continuing."