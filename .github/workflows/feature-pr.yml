name: Auto Draft PR for Feature Branches

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-draft-pr:
    name: Open draft PR → main
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Open draft pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ github.ref_name }}
          base: main
          title: "feat: ${{ github.ref_name }}"
          body: |
            🤖 **Auto-opened draft PR** for branch `${{ github.ref_name }}`.

            Rename this PR with a semantic title (e.g. `feat: ...`, `fix: ...`) — the Check PR Title workflow requires it.

            <!-- Created automatically by the feature-pr workflow on branch push. -->
          draft: true
          delete-branch: false