name: Feature request
description: Suggest an idea for this project
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you are solving and the value it adds.

  - type: textarea
    id: feature
    attributes:
      label: Describe the feature
      description: A clear and concise description of the feature you want.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Benefit / value
      description: What problem does this solve and who benefits?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or links that help explain the request.