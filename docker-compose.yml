services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Medusa Backend ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - STORE_CORS=${STORE_CORS}
      - ADMIN_CORS=${ADMIN_CORS}
      - AUTH_CORS=${AUTH_CORS}
      - MEDUSA_ADMIN_EMAIL=${MEDUSA_ADMIN_EMAIL}
      - MEDUSA_ADMIN_PASSWORD=${MEDUSA_ADMIN_PASSWORD}
      - NODE_ENV=development
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_FORCE_PATH_STYLE=true
      - S3_URL=${S3_URL}
    ports:
      - "9000:9000"

  # ── Next.js Storefront ─────────────────────────────
  storefront:
    build:
      context: .
      dockerfile: storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
      - MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL}
      - NEXT_PUBLIC_STORE_NAME=${NEXT_PUBLIC_STORE_NAME}
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
    ports:
      - "8000:3000"

  # ── MinIO (S3-compatible object storage) ─────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set divinekart http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p divinekart/products divinekart/uploads divinekart/invoices
      divinekart/waybills divinekart/support divinekart/logs &&
      mc anonymous set download divinekart/products &&
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # ── OpenObserve (logs / metrics / traces) ─────────
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
      - ZO_DATA_DIR=/data
    volumes:
      - openobserve_data:/data
    ports:
      - "5080:5080"   # UI + JSON ingest
      - "5081:5081"   # metrics ingest (OTLP)

  # ── Langfuse (LLM observability) ──────────────────
  langfuse-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER} -d ${LANGFUSE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - ENCRYPTION_KEY_DERIVATION_KEY=${LANGFUSE_KEY_DERIVATION_KEY}
      - LANGFUSE_INIT_DB=true
      - NEXT_PUBLIC_LANGFUSE_HOST=${NEXT_PUBLIC_LANGFUSE_HOST}
      - HOSTNAME=${HOSTNAME}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LANGFUSE_LOG_LEVEL=info

  # ── OmniRoute (AI Gateway) ──────────────────────────
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - API_HOST=0.0.0.0
      - LIVE_WS_PORT=20132
      - LIVE_WS_HOST=0.0.0.0
      - LIVE_WS_ALLOWED_ORIGINS=http://localhost:20128,http://127.0.0.1:20128
    volumes:
      - omniroute_data:/app/data
    ports:
      - "20128:20128"
      - "20129:20129"
      - "20132:20132"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  openwa:
    image: openwa/wa-automate:latest
    container_name: divinekart-openwa
    shm_size: '2gb'
    restart: unless-stopped
    command: --config /config/config.json --no-update
    environment:
      - WEBHOOK_URL=http://backend:9000/webhooks/whatsapp
      - ENABLE_QR_WEB=true
      - PORT=8002
      - HOST=0.0.0.0
      - WA_HOST=0.0.0.0
      - WA_PORT=8002
      - HEADLESS=true
      - DISABLE_SPINS=true
      - LOG_LEVEL=info
      - WA_CLI_CONFIG=/config/config.json
      - DBUS_SESSION_BUS_ADDRESS="disabled:"
    volumes:
      - openwa_sessions:/sessions
      - openwa_logs:/logs
      - ./openwa-config.json:/config/config.json:ro
    ports:
      - "8002:8002"   # QR code web interface + API
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8002/health || wget --quiet --tries=1 --spider http://127.0.0.1:8002/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  openobserve_data:
  langfuse_postgres_data:
  omniroute_data:
  openwa_sessions:
  openwa_logs:
